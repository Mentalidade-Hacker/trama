<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Trama · Notas conectadas</title>
  <script src="/theme.js"></script>
  <script src="/typography.js"></script>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/components.css">
  <link rel="stylesheet" href="/features.css">
  <link rel="stylesheet" href="/translation.css">
  <link rel="stylesheet" href="/writing.css">
  <link rel="stylesheet" href="/learning.css">
  <link rel="stylesheet" href="/vocabulary-suggestions.css">
  <link rel="stylesheet" href="/backup.css">
  <link rel="stylesheet" href="/update-ui.css">
  <link rel="stylesheet" href="/sync.css">
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/typography.css">
  <link rel="stylesheet" href="/workspace-ui.css">
  <link rel="stylesheet" href="/link-ui.css">
  <link rel="stylesheet" href="/connections.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#"><img src="/icon.svg" alt="">trama<span>LOCAL</span></a>
    <button class="search-launch" data-action="search">⌕ <span>Buscar ou criar página</span><kbd>Ctrl K</kbd></button>
    <nav aria-label="Navegação">
      <button data-action="daily"><span>▦</span> Notas diárias</button>
      <button data-action="journals"><span>☷</span> Diário contínuo</button>
      <button data-action="graph"><span>⌘</span> Visão do grafo</button>
      <button data-action="pages"><span>▤</span> Todas as páginas</button>
      <details class="workspace-tools" data-workspace-menu>
        <summary><span aria-hidden="true">⋯</span> Ferramentas</summary>
        <div class="workspace-tool-list">
          <button data-learning-open><span>✎</span> Aprender a escrever</button>
          <button data-feature="calendar"><span>▦</span> Calendário</button>
          <button data-feature="templates"><span>▧</span> Templates</button>
          <button data-feature="attachments"><span>⌁</span> Arquivos</button>
          <button data-feature="history"><span>↶</span> Histórico</button>
        </div>
      </details>
    </nav>
    <div class="sidebar-label" id="favorites-heading">ATALHOS</div>
    <div id="favorites"></div>
    <div class="sidebar-label">PÁGINAS RECENTES</div>
    <div id="recent"></div>
    <div class="sidebar-bottom">
      <button class="sync-indicator" data-sync-open data-sync-indicator><span data-sync-label role="status" aria-live="polite">Conectar outro computador</span></button>
      <button data-update-open data-update-indicator>↻ <span data-update-label>Atualizações</span></button>
      <details class="workspace-tools" data-workspace-menu>
        <summary><span aria-hidden="true">⚙</span> Aplicativo</summary>
        <div class="workspace-tool-list"><button data-action="settings">Dados e backups</button><button data-action="help">Guia e atalhos</button><button data-app-close hidden>Encerrar Trama</button></div>
      </details>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <button data-action="toggle-nav" title="Alternar navegação" aria-label="Alternar navegação">☰</button><button data-action="back" title="Voltar" aria-label="Voltar">←</button>
      <div id="breadcrumb">Meu grafo</div>
      <details class="workspace-writing-menu" data-workspace-menu>
        <summary>Mais</summary>
        <div class="workspace-writing-actions"><button data-action="proofread" title="Revisar ortografia e gramática · Ctrl Alt L">Revisar texto <kbd>Ctrl Alt L</kbd></button><button data-dictionary-open title="Consultar palavra · Alt Shift D">Dicionário <kbd>Alt Shift D</kbd></button><button data-writing-settings>Idioma e revisão ao digitar</button><button data-translate-page="pt">Traduzir página para português</button><button data-translate-page="en">Translate page to English</button><button data-vocabulary-open>Meu vocabulário</button><button data-vocabulary-suggest>Explorar palavras</button></div>
      </details>
      <button class="text-size-launch" data-action="theme" aria-label="Aparência e tamanho do texto" title="Tema e tamanho do texto">Aa</button>
      <span class="save-status" id="save-status" role="status">Abrindo…</span><button data-action="new" class="new-page">+ Nova página</button>
    </header>
    <div class="panes"><main id="main" tabindex="-1"><div class="loading">Abrindo seu grafo local…</div></main><aside id="right-panel" class="right-panel" hidden></aside></div>
    <footer><span>TRAMA <span class="version">/ 0.11</span></span><span id="stats"></span></footer>
  </div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" hidden></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <script src="/vendor/katex/katex.min.js"></script>
  <script type="module" src="/workspace-ui.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
